name: APK

on:
  push:
    branches: [claude/project-thread-7kisu7]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BotMusica.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BotMusica-apk
          path: BotMusica.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Bot de Música (APK)
          body: Control del bot para Android. Necesita Termux (F-Droid). Ver TERMUX.md.
          prerelease: true
          make_latest: false
          files: BotMusica.apk
